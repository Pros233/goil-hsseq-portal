      font-weight:700;

      color:var(--ar-orange);
    }

      border-radius:6px;
      padding:0 14px;
      border:1.5px solid rgba(244,121,32,.55);
      background:transparent;
      color:var(--ar-orange);
      font-size:11px;
      font-weight:800;
      letter-spacing:.65px;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .ar-print{
      min-height:36px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      color:var(--ar-text);
      padding:0 14px;
      font-weight:700;
      cursor:pointer;
      transition:.16s ease;
    }
    .ar-print:hover{
      border-color:rgba(244,121,32,.55);
      color:var(--ar-orange);
    }
    .ar-hero{

      margin-bottom:0;
    }
    .ar-hero .ar-inner{
      padding:36px 0 32px;
    }
    .ar-eyebrow{
      font-size:11px;
      font-weight:800;
      letter-spacing:1.1px;
      text-transform:uppercase;
      color:var(--ar-orange);
      margin-bottom:8px;
    }
    .ar-title{
      margin:0 0 10px;
      font-family:'Barlow Condensed',sans-serif;
      font-size:72px;
      line-height:.88;
      letter-spacing:.3px;
      text-transform:uppercase;
      color:#fff;

    .ar-subtitle{

      font-size:13px;
      line-height:1.45;
      color:var(--ar-muted);

    .ar-sheet-head{

      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      margin-bottom:18px;
    }
    .ar-sheet-brand{
      display:grid;
      gap:6px;
    }
    .ar-sheet-title{
      margin:0;
      font-family:'Barlow Condensed',sans-serif;
      font-size:34px;
      line-height:.92;
      text-transform:uppercase;
      letter-spacing:.4px;
      color:#111;

    .ar-sheet-note{

      font-size:12px;
      color:#4b5563;
      line-height:1.45;
    }

      letter-spacing:.6px;
      color:#6b7280;

      font-size:24px;
      font-weight:800;
      line-height:1;
      color:#111827;

      line-height:1.35;

      table-layout:fixed;
      font-size:13px;

      vertical-align:top;
      text-align:left;
      word-break:break-word;

      font-weight:700;
    }

      color:#6b7280;
      font-weight:700;
      background:#f1f5f9;

      padding-bottom:8px;

    .ar-col-response{width:120px}
    .ar-col-possibility,
    .ar-col-severity,

    .ar-col-comment{width:18%}
    .ar-col-action{width:22%}
    .ar-num{
      font-weight:700;
      white-space:nowrap;
    }
    .ar-response{
      font-weight:700;

    .ar-cell-muted{color:#6b7280}
    .ar-footer{
      margin-top:16px;
      font-size:11px;
      color:#6b7280;
      line-height:1.45;
    }
    .ar-empty{
      background:rgba(255,255,255,.03);
      border:1px dashed rgba(255,255,255,.15);
      border-radius:16px;
      padding:28px 24px;
      text-align:center;
      color:var(--ar-muted);
    }
    .ar-empty strong{
      display:block;
      margin-bottom:8px;
      font-family:'Barlow Condensed',sans-serif;
      font-size:28px;
      line-height:1;
      color:#fff;
      letter-spacing:.25px;
      text-transform:uppercase;
    }

    @media (max-width: 980px){
      .ar-inner,.ar-page{
        width:min(100vw, calc(100vw - 24px));
      }
      .ar-page{
        padding:14px 0 28px;
      }
      .ar-pill{
        font-size:10px;
        padding:0 10px;
      }
      .ar-sheet-head{
        flex-direction:column;
      }
      .ar-meta{
        grid-template-columns:1fr;
      }
      .ar-meta-item{
        grid-template-columns:130px 10px 1fr;
      }
      .ar-sheet{
        padding:18px;
      }
      .ar-title{
        font-size:42px;
      }
    }

    @media print{
      body{
        background:#fff;
      }
      .ar-page{
        width:auto;
        margin:0;
        padding:0;
      }
      .ar-topbar,
      .ar-hero{
        display:none;
      }
      .ar-sheet-wrap{
        background:transparent;
        border:0;
        box-shadow:none;
        padding:0;
      }
      .ar-sheet{
        border-radius:0;
        padding:0;
      }
      .ar-table-wrap{
        overflow:visible;
      }
      .ar-table{
        min-width:0;
      }
    }
  </style>
</head>

        var template = await loadChecklistTemplate(context);
        return buildLegacySessionFromCorrective(context, record, template, correctiveItems);
      }

      function buildTableMarkup(session, correctiveItems) {
        var catalog = session && session.catalog && typeof session.catalog === 'object' ? session.catalog : {};
        var sectionStates = session && session.sectionStates && typeof session.sectionStates === 'object' ? session.sectionStates : {};
        var correctiveLookup = buildCorrectiveLookup(correctiveItems);
        var sectionOrder = buildSectionOrder(session || {}, catalog);
        var strictExceptionRowsOnly = !!(session && session.strictExceptionRowsOnly);
        if (!sectionOrder.length || !Object.keys(catalog).length) return '';

        var catalogCodes = Object.keys(catalog);
        var html = '';

        sectionOrder.forEach(function (section) {
          var sectionId = trimString(section.id);
          var sectionLabel = displayValue(section.label, sectionId);
          var sectionState = sectionStates[sectionId] || {};
          var responses = sectionState.responses && typeof sectionState.responses === 'object' ? sectionState.responses : {};
          var comments = sectionState.comments && typeof sectionState.comments === 'object' ? sectionState.comments : {};
          var rowIndex = 0;
          var sectionCodes = catalogCodes.filter(function (code) {
            return trimString((catalog[code] || {}).sectionId) === sectionId;
          });
          if (strictExceptionRowsOnly) {
            sectionCodes = sectionCodes.filter(function (code) {
              return !!trimString(responses[code]);
            });
          }
          if (!sectionCodes.length) return;

          html += ''
            + '<tr class="ar-section-row">'
            + '<th colspan="8">' + esc(sectionLabel) + '</th>'
            + '</tr>'
            + '<tr class="ar-col-head">'
            + '<th class="ar-col-no">No.</th>'
            + '<th class="ar-col-question">Question</th>'
            + '<th class="ar-col-response">Response</th>'
            + '<th class="ar-col-possibility">Possibility</th>'
            + '<th class="ar-col-severity">Severity</th>'
            + '<th class="ar-col-risk">Risk</th>'
            + '<th class="ar-col-comment">Comment</th>'
            + '<th class="ar-col-action">Corrective Action</th>'
            + '</tr>';

          sectionCodes.forEach(function (code) {
            var item = catalog[code] || {};
            var response = trimString(responses[code]);
            var meta = responseMeta(response);
            var metric = metricForResponse(item, response);
            var correctiveMatch = correctiveLookup.byCode[code] || correctiveLookup.byQuestion[normalizeQuestion(item.question)] || null;
            var action = (response === 'N' || response === 'P')
              ? displayValue(correctiveMatch && correctiveMatch.correctiveAction, item.action)
              : '-';
            var comment = displayValue(comments[code], correctiveMatch && correctiveMatch.sourceComment);
            rowIndex += 1;

            html += ''
              + '<tr>'
              + '<td class="ar-num">' + esc(String(rowIndex) + '.') + '</td>'
              + '<td>' + esc(displayValue(item.question, code)) + '</td>'
              + '<td><span class="ar-response ' + esc(meta.cls) + '">' + esc(meta.label) + '</span></td>'
              + '<td>' + esc(metric.possibility) + '</td>'
              + '<td>' + esc(metric.severity) + '</td>'
              + '<td>' + esc(metric.risk) + '</td>'
              + '<td>' + esc(comment) + '</td>'
              + '<td>' + esc(action) + '</td>'
              + '</tr>';
          });
        });

        return html;
      }

      function renderLoading(message) {
        document.getElementById('registerRoot').innerHTML = ''
          + '<div class="ar-empty">'
          + '<strong>Loading Register</strong>'
          + '<div>' + esc(message) + '</div>'
          + '</div>';
      }

      function renderEmpty(message) {
        document.getElementById('registerRoot').innerHTML = ''
          + '<div class="ar-empty">'
          + '<strong>Register Unavailable</strong>'
          + '<div>' + esc(message) + '</div>'
          + '</div>';
      }

      async function renderRegister(context, record) {
        var session = await resolveSession(context, record);
        var correctiveItems = getCorrectiveItemsForRecord(record, context);
        var facility = readJSON(FACILITY_KEY, {});
        var meta = readJSON(META_KEY, {});
        var isDocumentRecovery = !!(session && session.recoveredFromDocument);
        var isReconstructed = !!(session && session.reconstructedFromCorrective);
        var isSummaryOnlyReconstruction = !!(session && session.reconstructedFromSummaryOnly);
        var recoveryData = isDocumentRecovery ? getLegacyRecoveryData(record, context) : null;
        var recoveredAnswerCount = recoveryData ? countAnsweredRowsFromSectionStates(recoveryData.sectionStates) : 0;
        var totalQuestionCount = session && session.catalog ? Object.keys(session.catalog).length : 0;
        var tableMarkup = buildTableMarkup(session, correctiveItems);
        if (!tableMarkup) {
          renderEmpty(
            isDocumentRecovery
              ? 'The archived document recovery did not contain any renderable rows for this assessment register.'
              : isReconstructed
              ? 'The exact assessment register could not be reconstructed because the published record no longer retains question-level checklist responses for this assessment.'
              : 'No locked checklist snapshot was found for this assessment register view.'
          );
          return;
        }

        var displayVersion = 1;
        if (record && window.RiskModuleUtils && typeof RiskModuleUtils.getPublishedDisplayVersionNumber === 'function') {
          displayVersion = RiskModuleUtils.getPublishedDisplayVersionNumber(record, RiskModuleUtils.getRecords());
        } else {
          displayVersion = normalizeVersion(
            (record && (record.version || record.version_number)) ||
            meta.versionCurrent ||
            context.version ||
            1
          );
        }

        var facilityName = displayValue(
          facility.nameDisplay,
          facility.nameVal,
          meta.facilityName,
          record && (record.facility_name || record.facilityName),
          context.facility
        );
        var assessor = displayValue(
          meta.inspectorName,
          facility.assessorName,
          record && (record.assessor_name || record.inspector)
        );
        var assessmentDate = displayValue(
          meta.inspectionDate,
          facility.assessmentDate,
          record && (record.assessment_date || record.inspectionDate)
        );
        var zone = displayValue(
          record && record.location,
          facility.zone,
          meta.location
        );
        var referenceNo = trimString(
          (record && (record.assessment_reference || record.inspectionRef)) ||
          meta.referenceNo ||
          context.ref
        ) || '-';

        _pdfState = {
          session: session,
          correctiveItems: correctiveItems,
          facilityName: facilityName,
          referenceNo: referenceNo,
          displayVersion: displayVersion,
          assessmentDate: assessmentDate,
          assessor: assessor,
          zone: zone
        };

        document.getElementById('pageSubtitle').textContent =
          (isDocumentRecovery
            ? 'Recovered archived assessment register for '
            : isSummaryOnlyReconstruction
            ? 'Legacy summary-only register for '
            : (isReconstructed ? 'Reconstructed read-only question register for ' : 'Read-only question register for '))
          + facilityName + ' (' + referenceNo + ').';

        document.getElementById('registerRoot').innerHTML = ''
          + '<div class="ar-sheet">'
          + '  <div class="ar-sheet-head">'
          + '    <div class="ar-sheet-brand">'
          + '      <h2 class="ar-sheet-title">Assessment Register</h2>'
          + '      <p class="ar-sheet-note">'
          + (isDocumentRecovery
              ? 'Recovered from archived register evidence (' + esc(displayValue(session.sourceLabel, 'legacy document')) + '). Only ' + esc(String(recoveredAnswerCount || 0)) + ' of ' + esc(String(totalQuestionCount || 0)) + ' question responses were preserved there, so the remaining rows stay blank because the original submitted checklist snapshot is no longer available for this assessment.'
              : isSummaryOnlyReconstruction
              ? 'Legacy register shell reconstructed from the active checklist template. The published record retained only a summary corrective row, so the exact question-level No/Partial responses are not recoverable for this assessment.'
              : (isReconstructed
              ? 'Legacy exception register reconstructed from retained item-level corrective findings because the original locked checklist snapshot is unavailable for this assessment.'
              : 'Question-by-question record generated from the locked checklist snapshot for this published assessment.')
            )
          + '</p>'
          + '    </div>'
          + '    <div class="ar-ref-box">'
          + '      <div class="ar-ref-k">Assessment Reference</div>'
          + '      <div class="ar-ref-v">' + esc(referenceNo) + '</div>'
          + '      <div class="ar-sheet-note" style="margin-top:8px">Version V' + esc(String(displayVersion || 1)) + '</div>'
          + '    </div>'
          + '  </div>'
          + '  <div class="ar-meta">'
          + '    <div class="ar-meta-item"><div class="ar-meta-k">Assessment Date</div><div class="ar-meta-sep">:</div><div class="ar-meta-v">' + esc(assessmentDate) + '</div></div>'
          + '    <div class="ar-meta-item"><div class="ar-meta-k">Facility</div><div class="ar-meta-sep">:</div><div class="ar-meta-v">' + esc(facilityName) + '</div></div>'
          + '    <div class="ar-meta-item"><div class="ar-meta-k">Assessor</div><div class="ar-meta-sep">:</div><div class="ar-meta-v">' + esc(assessor) + '</div></div>'
          + '    <div class="ar-meta-item"><div class="ar-meta-k">Zone / Location</div><div class="ar-meta-sep">:</div><div class="ar-meta-v">' + esc(zone) + '</div></div>'
          + '  </div>'
          + '  <div class="ar-table-wrap">'
          + '    <table class="ar-table">'
          + '      <tbody>' + tableMarkup + '</tbody>'
          + '    </table>'
          + '  </div>'
          + '  <div class="ar-footer">'
          + (isDocumentRecovery
              ? 'Archived recovery note: this register was restored from the attached historical document because the original locked checklist snapshot is no longer present in retained storage for this assessment. Only ' + esc(String(recoveredAnswerCount || 0)) + ' question responses were recoverable from that document, so every other row remains blank instead of being guessed.'
              : isSummaryOnlyReconstruction
              ? 'Legacy reconstruction note: this published record preserved only the summary corrective count and not the itemized exception rows, so the register cannot truthfully mark any question as Yes, No, or Partial beyond what was retained.'
              : (isReconstructed
              ? 'Legacy reconstruction note: only retained item-level exception rows are shown. Compliant Yes rows cannot be proven or recreated without the original locked checklist snapshot.'
              : 'Generated from the saved assessment snapshot. This view is read-only and mirrors the checklist responses recorded for the selected published assessment.')
            )
          + '  </div>'
          + '</div>';
      }

      function pdfResponseMeta(response) {
        if (response === 'N') return { label: 'No', colorStyle: 'no' };
        if (response === 'P') return { label: 'Partial', colorStyle: 'partial' };
        if (response === 'Y') return { label: 'Yes', colorStyle: 'yes' };
        if (response === 'NA') return { label: 'N/A', colorStyle: 'na' };
        return { label: '\u2014', colorStyle: 'blank' };
      }

      function loadPDFScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      function fetchImageDataUrl(src) {
        return fetch(src)
          .then(function (res) { return res.blob(); })
          .then(function (blob) {
            return new Promise(function (resolve, reject) {
              var reader = new FileReader();
              reader.onload = function () { resolve(reader.result); };
              reader.onerror = reject;
              reader.readAsDataURL(blob);
            });
          })
          .catch(function () { return null; });
      }

      async function generatePDF() {
        var state = _pdfState;
        if (!state) return;

        var btn = document.getElementById('printBtn');
        var origText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Generating PDF\u2026';

        try {
          if (!_pdfLibsLoaded) {
            await loadPDFScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
            await loadPDFScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
            _pdfLibsLoaded = true;
          }

          var jsPDF = window.jspdf.jsPDF;
          var W = 297, H = 210;
          var ORANGE = [244, 121, 32];
          var DARK_BG = [13, 17, 23];
          var SECT_BG = [26, 33, 43];
          var WHITE = [255, 255, 255];
          var MUTED = [155, 167, 181];
          var GREEN = [22, 163, 74];
          var RED_C = [220, 38, 38];
          var AMBER = [217, 119, 6];
          var GRAY_C = [107, 114, 128];

          var doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

          // ── Cover Page ────────────────────────────────────────────
          doc.setFillColor(DARK_BG[0], DARK_BG[1], DARK_BG[2]);
          doc.rect(0, 0, W, H, 'F');

          doc.setFillColor(ORANGE[0], ORANGE[1], ORANGE[2]);
          doc.rect(0, 0, W, 14, 'F');

          var logoDataUrl = await fetchImageDataUrl('../assets/img/goil-logo.png');
          if (logoDataUrl) {
            doc.addImage(logoDataUrl, 'PNG', W / 2 - 28, 22, 56, 28);
          }

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(62);
          doc.setTextColor(ORANGE[0], ORANGE[1], ORANGE[2]);
          doc.text('HSSEQ', W / 2, 96, { align: 'center' });

          doc.setFont('helvetica', 'normal');
          doc.setFontSize(20);
          doc.setTextColor(WHITE[0], WHITE[1], WHITE[2]);
          doc.text('ASSESSMENT REGISTER', W / 2, 110, { align: 'center' });

          doc.setDrawColor(ORANGE[0], ORANGE[1], ORANGE[2]);
          doc.setLineWidth(0.5);
          doc.line(W / 2 - 70, 116, W / 2 + 70, 116);

          function metaBlock(x, y, label, value) {
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(6.5);
            doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
            doc.text(label.toUpperCase(), x, y);
            doc.setFontSize(11);
            doc.setTextColor(WHITE[0], WHITE[1], WHITE[2]);
            doc.text(value || '\u2014', x, y + 7);
          }

          var MX = 68, RX = 168, MY = 130;
          metaBlock(MX, MY,      'Facility',         state.facilityName);
          metaBlock(RX, MY,      'Reference No.',    '(' + state.referenceNo + ')  Version V' + state.displayVersion);
          metaBlock(MX, MY + 18, 'Assessment Date',  state.assessmentDate);
          metaBlock(RX, MY + 18, 'Assessor',         state.assessor);
          metaBlock(MX, MY + 36, 'Zone / Location',  state.zone || '\u2014');
          metaBlock(RX, MY + 36, 'Classification',   'Confidential \u2013 Internal Use Only');

          // ── Table Pages ───────────────────────────────────────────
          var session = state.session;
          var catalog = (session && session.catalog) || {};
          var sectionStates = (session && session.sectionStates) || {};
          var caItems = state.correctiveItems || [];
          var secOrder = buildSectionOrder(session || {}, catalog);
          var caLookup = buildCorrectiveLookup(caItems);
          var strictOnly = !!(session && session.strictExceptionRowsOnly);
          var allCodes = Object.keys(catalog);

          var tableBody = [];
          secOrder.forEach(function (sec) {
            var sid = trimString(sec.id);
            var slabel = displayValue(sec.label, sid).toUpperCase();
            var ss = sectionStates[sid] || {};
            var resp = ss.responses || {};
            var coms = ss.comments || {};

            var codes = allCodes.filter(function (c) {
              return trimString((catalog[c] || {}).sectionId) === sid;
            });
            if (strictOnly) {
              codes = codes.filter(function (c) { return !!trimString(resp[c]); });
            }
            if (!codes.length) return;

            tableBody.push([{ content: slabel, colSpan: 8, _isSect: true }]);

            var rIdx = 0;
            codes.forEach(function (code) {
              var item = catalog[code] || {};
              var response = trimString(resp[code]);
              var rm = pdfResponseMeta(response);
              var metric = metricForResponse(item, response);
              var caMatch = caLookup.byCode[code]
                || caLookup.byQuestion[normalizeQuestion(item.question)]
                || null;
              var action = (response === 'N' || response === 'P')
                ? displayValue(caMatch && caMatch.correctiveAction, item.action)
                : '\u2014';
              var comment = displayValue(coms[code], caMatch && caMatch.sourceComment);
              if (comment === '-') comment = '\u2014';
              if (action === '-') action = '\u2014';
              rIdx++;

              var riskNum = parseFloat(metric.risk);
              tableBody.push([
                String(rIdx) + '.',
                displayValue(item.question, code),
                { content: rm.label, _resp: rm.colorStyle },
                (metric.possibility !== '-') ? metric.possibility : '\u2014',
                (metric.severity !== '-') ? metric.severity : '\u2014',
                { content: (metric.risk !== '-') ? String(metric.risk) : '\u2014', _risk: isNaN(riskNum) ? 0 : riskNum },
                comment,
                action
              ]);
            });
          });

          var hLeft   = 'GOIL HSSEQ \u2013 Assessment Register';
          var hCenter = state.facilityName + ' \u00B7 ' + state.referenceNo;

          doc.addPage();

          doc.autoTable({
            startY: 15,
            margin: { left: 8, right: 8, top: 15 },
            head: [[
              { content: 'No.',          styles: { halign: 'center' } },
              'Question',
              { content: 'Response',     styles: { halign: 'center' } },
              { content: 'Possibility',  styles: { halign: 'center' } },
              { content: 'Severity',     styles: { halign: 'center' } },
              { content: 'Risk',         styles: { halign: 'center' } },
              'Comment',
              'Corrective Action'
            ]],
            body: tableBody,
            theme: 'grid',
            headStyles: {
              fillColor: ORANGE,
              textColor: WHITE,
              fontStyle: 'bold',
              fontSize: 8,
              cellPadding: { top: 3, bottom: 3, left: 3, right: 3 }
            },
            bodyStyles: {
              fontSize: 7.5,
              cellPadding: { top: 2.5, bottom: 2.5, left: 3, right: 3 },
              valign: 'middle',
              textColor: [30, 30, 30],
              lineColor: [209, 213, 219],
              lineWidth: 0.15
            },
            columnStyles: {
              0: { cellWidth: 12, halign: 'center' },
              1: { cellWidth: 78 },
              2: { cellWidth: 22, halign: 'center' },
              3: { cellWidth: 18, halign: 'center' },
              4: { cellWidth: 18, halign: 'center' },
              5: { cellWidth: 16, halign: 'center' },
              6: { cellWidth: 52 }
            },
            didParseCell: function (data) {
              if (data.section !== 'body') return;
              var raw0 = data.row.raw[0];
              if (raw0 && typeof raw0 === 'object' && raw0._isSect) {
                data.cell.styles.fillColor = SECT_BG;
                data.cell.styles.textColor = WHITE;
                data.cell.styles.fontStyle = 'bold';
                data.cell.styles.fontSize = 8.5;
                data.cell.styles.cellPadding = { top: 4, bottom: 4, left: 5, right: 5 };
                return;
              }
              var rawCell = data.row.raw[data.column.index];
              if (!rawCell || typeof rawCell !== 'object') return;
              if (rawCell._resp === 'yes') {
                data.cell.styles.textColor = GREEN;
                data.cell.styles.fontStyle = 'bold';
              } else if (rawCell._resp === 'no') {
                data.cell.styles.textColor = RED_C;
                data.cell.styles.fontStyle = 'bold';
              } else if (rawCell._resp === 'partial') {
                data.cell.styles.textColor = AMBER;
                data.cell.styles.fontStyle = 'bold';
              } else if (rawCell._resp === 'na') {
                data.cell.styles.textColor = GRAY_C;
              }
              if (rawCell._risk > 0) {
                if (rawCell._risk >= 15) {
                  data.cell.styles.fillColor = RED_C;
                  data.cell.styles.textColor = WHITE;
                  data.cell.styles.fontStyle = 'bold';
                } else if (rawCell._risk >= 8) {
                  data.cell.styles.fillColor = [251, 146, 60];
                  data.cell.styles.textColor = WHITE;
                  data.cell.styles.fontStyle = 'bold';
                } else {
                  data.cell.styles.fillColor = [254, 240, 138];
                  data.cell.styles.textColor = [120, 53, 15];
                  data.cell.styles.fontStyle = 'bold';
                }
              }
            },
            didDrawPage: function () {
              var pageNum = doc.internal.getNumberOfPages();
              doc.setFillColor(ORANGE[0], ORANGE[1], ORANGE[2]);
              doc.rect(0, 0, W, 13, 'F');
              doc.setFont('helvetica', 'bold');
              doc.setFontSize(7.5);
              doc.setTextColor(WHITE[0], WHITE[1], WHITE[2]);
              doc.text(hLeft,              8,       8.5);
              doc.text(hCenter,            W / 2,   8.5, { align: 'center' });
              doc.text('Page ' + String(pageNum), W - 8, 8.5, { align: 'right' });
            }
          });

          var safeFacility = state.facilityName.replace(/[^a-zA-Z0-9]/g, '_');
          var safeRef      = state.referenceNo.replace(/[^a-zA-Z0-9\-]/g, '_');
          doc.save('GOIL_Assessment_Register_' + safeFacility + '_' + safeRef + '.pdf');

        } catch (err) {
          console.error('[generatePDF] failed:', err);
          alert('PDF export failed. Please try again.');
        } finally {
          btn.disabled = false;
          btn.textContent = origText;
        }
      }

      async function init() {
        var context = getRouteContext();
        document.getElementById('backBtn').addEventListener('click', function () {
          window.location.href = getBackHref(context);
        });
        document.getElementById('printBtn').addEventListener('click', function () {
          generatePDF();
        });

        renderLoading('Hydrating the selected assessment and checklist template...');

        if (!context.ref) {
          renderEmpty('No assessment reference was provided for this register view.');
          return;
        }

        var record = getFilePreviewRecord(context) || hydrateRecord(context) || buildLegacyRecoveryRecord(context);
        if (!record) {
          renderEmpty('The selected assessment could not be loaded from the local register data.');
          return;
        }

        await renderRegister(context, record);
      }

      document.addEventListener('DOMContentLoaded', function () {
        init().catch(function (error) {
          console.error('assessment register init failed', error);
          renderEmpty('The assessment register could not be loaded for this published assessment.');
        });
      });
    })();
  </script>
</body>
</html>
