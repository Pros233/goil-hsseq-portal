<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Barlow', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ── Layout ─────────────────────────────────────────────── */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      height: 100vh;
      background: #0b0e14;
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: width 0.26s ease;
      overflow: hidden;
      z-index: 40;
    }
    .sidebar.collapsed { width: 62px; }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo-g {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: #FF6B00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      flex-shrink: 0;
    }
    .logo-text { overflow: hidden; white-space: nowrap; }
    .logo-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: #FF9D4D;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1;
    }
    .logo-sub {
      font-size: 9px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* Nav */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-family: 'Barlow', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      width: 100%;
      text-align: left;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
    .nav-item.active {
      background: rgba(255,107,0,0.15);
      color: #FF6B00;
      font-weight: 600;
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: #FF6B00;
    }
    .nav-icon {
      flex-shrink: 0;
      width: 17px;
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-icon svg { width: 17px; height: 17px; }
    .nav-label { flex: 1; overflow: hidden; }
    .nav-badge {
      flex-shrink: 0;
      background: #EF4444;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 999px;
      min-width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    /* User */
    .sidebar-user {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 10px 8px;
      flex-shrink: 0;
    }
    .user-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: transparent;
      border: none;
      width: 100%;
      cursor: pointer;
      color: #fff;
      overflow: hidden;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .user-btn:hover { background: rgba(255,255,255,0.06); }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #FF6B00;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .user-info-wrap { overflow: hidden; }
    .user-name { font-size: 12px; font-weight: 600; color: #fff; line-height: 1; }
    .user-role { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 2px; }

    /* Collapse toggle */
    .collapse-btn {
      position: absolute;
      right: -11px;
      top: 64px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: #1a1d22;
      color: rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .collapse-btn:hover { background: #FF6B00; color: #fff; border-color: #FF6B00; }
    .collapse-btn svg { width: 11px; height: 11px; }

    /* collapsed state hides labels */
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .nav-badge,
    .sidebar.collapsed .logo-text,
    .sidebar.collapsed .user-info-wrap { display: none; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 9px 0; }
    .sidebar.collapsed .user-btn { justify-content: center; padding: 8px 0; }
    .sidebar.collapsed .sidebar-logo { justify-content: center; padding: 18px 0 16px; }

    /* ── Main ────────────────────────────────────────────────── */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Topbar ──────────────────────────────────────────────── */
    .topbar {
      height: 54px;
      flex-shrink: 0;
      background: #0d1117;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
    }

    .topbar-spacer { flex: 1; }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.65);
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.09); }
    .icon-btn svg { width: 16px; height: 16px; }

    .topbar-divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.09);
      margin: 0 4px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 10px;
      cursor: pointer;
      background: transparent;
      border: none;
      color: #fff;
      transition: background 0.15s;
    }
    .user-pill:hover { background: rgba(255,255,255,0.06); }
    .user-pill-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #FF6B00;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .user-pill-name { font-size: 13px; font-weight: 500; }
    .user-pill svg { width: 13px; height: 13px; color: rgba(255,255,255,0.4); }

    /* Theme toggle */
    .goil-theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.65);
      transition: background 0.15s;
    }
    .goil-theme-btn:hover { background: rgba(255,255,255,0.09); }
    .goil-theme-btn svg { width: 16px; height: 16px; }

    /* ── Content ─────────────────────────────────────────────── */
    .content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* ── Welcome Hero ────────────────────────────────────────── */
    .welcome-hero {
      width: 100%;
      background: linear-gradient(180deg, #161d2a 0%, #0d1117 100%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 44px 40px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .welcome-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 4px;
    }

    .welcome-greeting {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 36px;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
      letter-spacing: -0.3px;
    }
    .welcome-greeting span { color: #FF6B00; }

    .welcome-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.45);
      max-width: 480px;
      line-height: 1.6;
    }

    .welcome-divider {
      width: 40px;
      height: 3px;
      border-radius: 2px;
      background: #FF6B00;
      margin-top: 4px;
    }

    /* ── Module Grid ─────────────────────────────────────────── */
    .modules-section {
      width: 100%;
      padding: 32px 32px 48px;
    }

    .modules-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 18px;
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    @media (max-width: 900px)  { .welcome-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 660px)  { .welcome-grid { grid-template-columns: repeat(2, 1fr); } }

    .wcard {
      background: #161d2a;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 26px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .wcard:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,107,0,0.25);
      border-color: rgba(255,107,0,0.3);
    }

    .wcard-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .wcard-icon svg { width: 26px; height: 26px; }

    .wcard-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #fff;
      line-height: 1.2;
    }

    .wcard-desc {
      font-size: 12.5px;
      color: rgba(255,255,255,0.38);
      line-height: 1.5;
    }

    .wcard-arrow {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,107,0,0.7);
    }
    .wcard-arrow svg { width: 13px; height: 13px; }
    .wcard:hover .wcard-arrow { color: #FF6B00; }
  </style>
</head>
<body>
<div class="app">

  <!-- ════════════════════════════════════════
       SIDEBAR
  ════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/img/goil-logo.png" alt="GOIL" style="width:36px;height:36px;object-fit:contain;flex-shrink:0;border-radius:9px;" />
      <div class="logo-text">
        <div class="logo-title">GOIL HSSEQ</div>
        <div class="logo-sub">Department</div>
      </div>
    </div>

    <button class="collapse-btn" id="collapseBtn" title="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="sidebar-user">
      <button class="user-btn">
        <div class="user-avatar" id="sidebarUserAvatar">AD</div>
        <div class="user-info-wrap">
          <div class="user-name" id="sidebarUserName">Admin User</div>
          <div class="user-role">HSSEQ Platform</div>
        </div>
      </button>
    </div>
  </aside>

  <!-- ════════════════════════════════════════
       MAIN
  ════════════════════════════════════════ -->
  <div class="main">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-spacer"></div>

      <button class="goil-theme-btn" onclick="window.GoilTheme && GoilTheme.toggle()" title="Toggle theme"></button>

      <div class="topbar-divider"></div>

      <button class="user-pill">
        <div class="user-pill-avatar" id="topbarAvatar">AD</div>
        <span class="user-pill-name" id="topbarName">Admin User</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </header>

    <!-- Scrollable content -->
    <div class="content">

      <!-- Welcome Hero -->
      <div class="welcome-hero">
        <img class="welcome-logo" src="../assets/img/goil-logo.png" alt="GOIL" />
        <div class="welcome-greeting">Welcome back, <span id="welcomeName">there</span></div>
        <div class="welcome-sub">Your GOIL Health, Safety, Security, Environment &amp; Quality platform. Select a module below to get started.</div>
        <div class="welcome-divider"></div>
      </div>

      <!-- Module Cards -->
      <div class="modules-section">
        <div class="modules-label">Platform Modules</div>
        <div class="welcome-grid" id="welcomeGrid"></div>
      </div>

    </div><!-- /content -->
  </div><!-- /main -->
</div><!-- /app -->

  /* ── Render welcome grid ─────────────────────────────────── */

  /* ── Render sidebar nav ─────────────────────────────────── */

    var nav = document.getElementById('sidebarNav');
    if (!nav) return;
    nav.innerHTML = NAV_ITEMS.map(function(item) {
      var active = item.id === activeId;
      var iconSvg = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        item.path + '</svg>';
      var badgeHtml = item.badge ? '<span class="nav-badge">' + item.badge + '</span>' : '';
      return '<button class="nav-item' + (active ? ' active' : '') + '"' +
        ' data-id="' + item.id + '"' +
        ' data-href="' + (item.href || '') + '">' +
        '<span class="nav-icon">' + iconSvg + '</span>' +
        '<span class="nav-label">' + item.label + '</span>' +
        badgeHtml +
      '</button>';
    }).join('');

    nav.querySelectorAll('.nav-item').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var href = btn.getAttribute('data-href');
        if (href) { window.location.href = href; return; }
        nav.querySelectorAll('.nav-item').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });
  }

  /* ── Sidebar collapse ───────────────────────────────────── */
  function initCollapse() {
    var sidebar = document.getElementById('sidebar');
    var btn = document.getElementById('collapseBtn');
    if (!sidebar || !btn) return;
    var collapsed = false;
    btn.addEventListener('click', function() {
      collapsed = !collapsed;
      sidebar.classList.toggle('collapsed', collapsed);
      btn.querySelector('polyline').setAttribute('points',
        collapsed ? '9 18 15 12 9 6' : '15 18 9 12 15 6');
    });
  }

  /* ── User identity ──────────────────────────────────────── */
  function initUserDisplay() {
    var attempts = 0;
    var poll = setInterval(function() {
      attempts++;
      var ctx = window.GOIL_AUTH_CONTEXT;
      if (ctx && ctx.profile) {
        clearInterval(poll);
        var name = ctx.profile.full_name || ctx.session.user.email || 'there';
        var first = name.split(' ')[0];
        var initials = name.split(' ').map(function(w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
        var nameEl    = document.getElementById('sidebarUserName');
        var topName   = document.getElementById('topbarName');
        var sbAvatar  = document.getElementById('sidebarUserAvatar');
        var tbAvatar  = document.getElementById('topbarAvatar');
        var welcomeEl = document.getElementById('welcomeName');
        if (nameEl)    nameEl.textContent    = name;
        if (topName)   topName.textContent   = name;
        if (sbAvatar)  sbAvatar.textContent  = initials;
        if (tbAvatar)  tbAvatar.textContent  = initials;
        if (welcomeEl) welcomeEl.textContent = first;
      }
      if (attempts > 30) clearInterval(poll);
    }, 100);
  }

  /* ── Init ───────────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', function() {
    renderNav('dashboard');
    renderGrid();
    initCollapse();
    initUserDisplay();
  });

})();
</script>
</body>
</html>
