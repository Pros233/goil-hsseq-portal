  <style>
    html, body {

    body {

    .uc-topbar {

      background: rgba(14,16,22,.96);

    .uc-topbar-left {

    }

    .uc-topbar-right {

      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .uc-brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
      min-width: 0;
    }

    .uc-logo {
      height: 34px;
      width: auto;
      display: block;
      flex: 0 0 auto;
    }

    .uc-topbar-title {
      color: var(--or, #F47920);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: calc(24px * var(--goil-font-scale, 1));
      line-height: .92;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .uc-back-btn {
      height: 38px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.03);
      color: rgba(255,255,255,.74);
      font-family: 'Barlow', sans-serif;
      font-size: calc(12px * var(--goil-font-scale, 1));
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all var(--t);
    }

    .uc-back-btn:hover {
      border-color: rgba(244,121,32,.34);
      color: var(--or, #F47920);
      background: rgba(244,121,32,.08);
    }

    .uc-shell {
      width: min(1680px, 97vw);
      height: calc(100vh - 58px);
      margin: 0 auto;
      padding-bottom: 6px;
      overflow: hidden;
    }

    .uc-card {
      border: 0;
      background: transparent;
      height: 100%;
      padding: 10px 8px 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 6px;
      overflow: hidden;
      position: relative;
    }

    .uc-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto;
      height: 132px;
      border-radius: 0 0 24px 24px;
      background:
        radial-gradient(circle at 88% 30%, rgba(244,121,32,.18), transparent 22%),
        linear-gradient(180deg, rgba(17,20,27,.92), rgba(17,20,27,.55) 58%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .uc-kpis,
    .uc-stage-panel {
      position: relative;
      z-index: 1;
    }

    .uc-export {
      height: 46px;
      min-width: 150px;
      padding: 0 18px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(24,27,36,.72);
      color: var(--wh2, #C9D1D9);
      font-size: calc(15px * var(--goil-font-scale, 1));
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all var(--t);
    }

    .uc-export:hover {
      border-color: rgba(244,121,32,.42);
      color: var(--or, #F47920);
      background: rgba(244,121,32,.08);
    }

    .uc-kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .uc-kpi {
      --accent: #F47920;
      min-height: 84px;
      padding: 10px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, #171b23 0%, #151922 100%);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 10px 28px rgba(0,0,0,.16);
    }

    .uc-kpi::before {
      content: '';
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      width: 100%;
      border-radius: 20px 20px 0 0;
      background: rgba(244,121,32,.85);
      pointer-events: none;
    }

    .uc-kpi.total {
      --accent: #F47920;
      background: linear-gradient(180deg, #171b23 0%, #151922 100%);
    }

    .uc-kpi.draft {
      --accent: #FF9A40;
      background: linear-gradient(180deg, #171b23 0%, #151922 100%);
    }

    .uc-kpi.pending {
      --accent: #F47920;
      background: linear-gradient(180deg, #171b23 0%, #151922 100%);
    }

    .uc-kpi-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid rgba(244,121,32,.32);
      background: rgba(244,121,32,.10);
      color: var(--or, #F47920);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
      position: relative;
      z-index: 1;
    }

    .uc-kpi.total .uc-kpi-icon {
      border-color: rgba(244,121,32,.32);
      background: rgba(244,121,32,.10);
      color: #F47920;
    }

    .uc-kpi.draft .uc-kpi-icon {
      border-color: rgba(244,121,32,.28);
      background: rgba(244,121,32,.08);
      color: #FF9A40;
    }

    .uc-kpi.pending .uc-kpi-icon {
      border-color: rgba(244,121,32,.24);
      background: rgba(244,121,32,.06);
      color: #F47920;
    }

    .uc-kpi-copy {
      display: grid;
      gap: 4px;
      position: relative;
      z-index: 1;
    }

    .uc-kpi .k {
      color: rgba(255,255,255,.72);
      font-size: calc(11px * var(--goil-font-scale, 1));
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      line-height: 1.25;
    }

    .uc-kpi .v {
      color: var(--or, #F47920);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: calc(clamp(28px, 2.8vw, 36px) * var(--goil-font-scale, 1));
      font-weight: 900;
      line-height: .92;
    }

    .uc-kpi .n {
      color: rgba(255,255,255,.34);
      font-size: calc(10px * var(--goil-font-scale, 1));
      line-height: 1.35;
    }

    .uc-kpi-wave {
      position: absolute;
      right: 18px;
      bottom: 10px;
      width: 76px;
      height: 18px;
      opacity: .72;
      pointer-events: none;
    }

    .uc-kpi-wave path {
      stroke: #F47920;
    }

    .uc-stage-panel {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      overflow: hidden;
      background: #151922;
      box-shadow: 0 18px 38px rgba(0,0,0,.18);
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .uc-stage-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 340px) 170px 170px;
      gap: 10px;
      align-items: center;
      padding: 8px 18px 6px;
    }

    .uc-tabs {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .uc-tab {
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.40);
      font-size: calc(11px * var(--goil-font-scale, 1));
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      padding: 5px 6px 9px;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: color var(--t), border-color var(--t);
    }

    .uc-tab.active {
      color: var(--or, #F47920);
      border-bottom-color: var(--or, #F47920);
    }

    .uc-tab .count {
      min-width: 24px;
      height: 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,255,255,.03);

      border-color: rgba(244,121,32,.38);
      color: #F47920;
    }

      position: relative;
      display: block;
    }

    .uc-search-input {
      height: 40px;
      border-radius: 13px;
      padding: 0 52px 0 16px;
      border-color: rgba(255,255,255,.10);
      background: #0d0f14;
      color: #e6edf3;
      font-size: calc(12px * var(--goil-font-scale, 1));
    }

    .uc-search-icon {

      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      color: var(--wh3, #8B949E);

      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

      color: #e6edf3;

    }

      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .uc-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1240px;
    }

    .uc-table td {
      padding: 6px 14px;
      border-bottom: 1px solid rgba(255,255,255,.05);

      vertical-align: middle;

      color: var(--wh2, #C9D1D9);

      font-size: calc(11px * var(--goil-font-scale, 1));

      font-weight: 600;
      letter-spacing: .01em;
    }

    .uc-ref-type {
      color: var(--wh3, #8B949E);

    .uc-fac {
      display: grid;
      gap: 2px;
    }

    .uc-fac .main {
      color: var(--wh, #E6EDF3);
      font-family: 'Barlow', sans-serif;
      font-size: calc(11px * var(--goil-font-scale, 1));
      line-height: 1.1;
      font-weight: 600;
    }

    .uc-fac .sub {
      color: var(--wh4, #484F58);
      font-size: calc(10px * var(--goil-font-scale, 1));
      line-height: 1.2;
    }

    .uc-zone {
      color: var(--wh2, #C9D1D9);
      font-family: 'Barlow', sans-serif;
      font-size: calc(11px * var(--goil-font-scale, 1));
      line-height: 1.1;
      font-weight: 500;
    }

    .uc-stage-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 12px;
      border-radius: 999px;

      background: rgba(255,255,255,.03);

      font-weight: 700;

    }

      border-color: rgba(255,255,255,.16);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.72);
    }

    .uc-progress {
      display: grid;
      gap: 3px;
      min-width: 168px;
    }

    .uc-progress .pct {
      color: var(--wh, #E6EDF3);
      font-family: 'Barlow', sans-serif;

      font-weight: 600;

    .uc-progress-line {

      overflow: hidden;
    }

    .uc-progress-fill {
      display: block;
      height: 100%;
      border-radius: 999px;
    }

    .uc-progress-fill.draft { background: linear-gradient(90deg, #F47920, #FF9A40); }
    .uc-progress-fill.pending { background: linear-gradient(90deg, #F47920, #FF9A40); }
    .uc-progress-fill.reopened { background: linear-gradient(90deg, rgba(244,121,32,.88), rgba(255,154,64,.72)); }

    .uc-progress .sub {
      color: rgba(255,255,255,.40);
      font-size: calc(10px * var(--goil-font-scale, 1));
      line-height: 1.3;
    }

    .uc-updated {
      display: grid;
      gap: 1px;
      color: var(--wh3, #8B949E);
      font-size: calc(9px * var(--goil-font-scale, 1));
      line-height: 1.2;
      white-space: nowrap;
    }

    .uc-updated .date,
    .uc-updated .time {
      color: var(--wh2, #C9D1D9);
      font-weight: 600;
    }

    .uc-updated .rel {
      color: rgba(255,255,255,.28);
    }

    .uc-col-action {
      width: 232px;
      text-align: center !important;
    }

    .uc-col-action-cell {
      text-align: center !important;
    }

    .uc-actions {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .uc-btn {
      height: 34px;
      min-width: 200px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: var(--wh, #E6EDF3);
      font-size: calc(11px * var(--goil-font-scale, 1));
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      padding: 0 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all var(--t);
    }

    .uc-btn:hover {
      border-color: rgba(244,121,32,.42);
      background: rgba(244,121,32,.10);
      color: #fff;
      transform: translateY(-1px);
    }

    .uc-btn-view-only {
      opacity: 0.45;
      cursor: not-allowed !important;
      border-color: rgba(255,255,255,.06) !important;
      background: transparent !important;
      color: var(--wh3, #8B949E) !important;
    }
    .uc-btn-view-only:hover {
      transform: none !important;
      border-color: rgba(255,255,255,.06) !important;
      background: transparent !important;
      color: var(--wh3, #8B949E) !important;
    }

    .uc-empty {
      padding: 28px 20px;
      text-align: center;
      color: var(--wh3, #8B949E);
      font-size: calc(15px * var(--goil-font-scale, 1));
      font-weight: 500;
    }

    .uc-table-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 8px 18px;
      flex: 0 0 auto;
    }

    .uc-results-meta {
      color: var(--wh3, #8B949E);
      font-size: calc(12px * var(--goil-font-scale, 1));
      line-height: 1.4;
    }

    .uc-pagination {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .uc-page-btn {
      min-width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(9,15,24,.82);
      color: var(--wh2, #C9D1D9);
      font-size: calc(13px * var(--goil-font-scale, 1));
      font-weight: 700;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--t);
    }

    .uc-page-btn:hover:not(:disabled) {

      color: var(--or, #F47920);
    }

    .uc-page-btn.active {
      background: linear-gradient(180deg, rgba(244,121,32,.96), rgba(218,100,20,.96));
      border-color: rgba(244,121,32,.52);
      color: #fff;
      box-shadow: 0 10px 24px rgba(244,121,32,.25);
    }

    .uc-page-btn:disabled {
      opacity: .45;
      cursor: default;
    }

      background: #f3f5f8 !important;
      color: #1c1e21 !important;
    }

      background: rgba(255,255,255,.96) !important;

      box-shadow: 0 6px 18px rgba(19, 26, 39, 0.06);

<script src="../assets/js/risk-module-utils.js?v=20260513-snapshotlatest1"></script>
  <script>
    const STATUS = RiskModuleUtils.STATUS();
    const SECTION_ORDER = ['doc', 'hsse', 'elec', 'fire', 'fore', 'disp', 'tank', 'env', 'sec', 'wel', 'other'];

    const state = {
      activeTab: 'all',
      allRows: [],
      rows: [],
      page: 1,
      pageSize: 8
    };

    function isCorrectiveActionStage(status) {
      return status === STATUS.PENDING_CORRECTIVE
        || status === STATUS.REVISED_CHECKLIST_SUBMITTED
        || status === STATUS.REOPENED;
    }

    function rowsForTab(rows, tab) {
      return (rows || []).filter(function (row) {
        if (tab === 'draft') return row.status === STATUS.DRAFT || row.status === STATUS.IN_PROGRESS;
        if (tab === 'pending') return row.status === STATUS.PENDING_CORRECTIVE || row.status === STATUS.REVISED_CHECKLIST_SUBMITTED;
        if (tab === 'reopened') return row.status === STATUS.REOPENED;
        return true;
      });
    }

    function rowsInFilterScope() {
      return rowsForTab(state.allRows, state.activeTab);
    }

    function masterRef(record) {
      if (window.RiskModuleUtils && typeof RiskModuleUtils.getParentInspectionReference === 'function') {
        return String(RiskModuleUtils.getParentInspectionReference(record) || '').trim();
      }
      return String(record.inspectionRef || record.assessment_reference || '').trim();
    }

    function recordVersion(record) {
      if (window.RiskModuleUtils && typeof RiskModuleUtils.getRecordVersionNumber === 'function') {
        return RiskModuleUtils.getRecordVersionNumber(record);
      }
      const n = Number(record.version || record.version_number || 1);
      return Number.isFinite(n) && n > 0 ? n : 1;
    }

    function toMs(value) {
      const ms = new Date(value || 0).getTime();
      return Number.isFinite(ms) ? ms : 0;
    }

    function normalizeRiskLevel(level) {
      const raw = String(level || '').toLowerCase();
      if (raw === 'critical') return 'Critical';
      if (raw === 'high') return 'High';
      if (raw === 'medium' || raw === 'moderate') return 'Medium';
      return 'Low';
    }

    function statusLabel(status) {
      if (status === STATUS.PENDING_CORRECTIVE || status === STATUS.REVISED_CHECKLIST_SUBMITTED) return 'Pending Corr. Action';
      if (status === STATUS.REOPENED) return 'Reopened / Under Revision';
      return 'Draft / In Progress';
    }

    function statusToneClass(status) {
      if (status === STATUS.PENDING_CORRECTIVE || status === STATUS.REVISED_CHECKLIST_SUBMITTED) return 'pending';
      if (status === STATUS.REOPENED) return 'reopened';
      return 'draft';
    }

    function statusPriority(status) {
      if (status === STATUS.PENDING_CORRECTIVE || status === STATUS.REVISED_CHECKLIST_SUBMITTED) return 3;
      if (status === STATUS.DRAFT || status === STATUS.IN_PROGRESS) return 2;
      if (status === STATUS.REOPENED) return 1;
      return 0;
    }

    function zoneShort(value) {
      const raw = String(value || '').trim();
      if (!raw) return '-';
      const cleaned = raw.replace(/^zonal office\s*/i, '');
      return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
    }

    function meaningfulText(value) {
      const raw = String(value == null ? '' : value).trim();
      if (!raw) return '';
      const lowered = raw.toLowerCase();
      if (lowered === '-' || lowered === 'n/a' || lowered === 'null' || lowered === 'undefined') return '';
      return raw;
    }

    function familyValue(records, keys, fallback) {
      const list = Array.isArray(records) ? records : [];
      for (let i = 0; i < list.length; i += 1) {
        const record = list[i] || {};
        for (let j = 0; j < keys.length; j += 1) {
          const value = meaningfulText(record[keys[j]]);
          if (value) return value;
        }
      }
      return fallback;
    }

    function progressValue(record, status) {
      const raw = Number(record.progress || record.progressPct || record.progress_percent || 0);
      if (Number.isFinite(raw) && raw > 0) return Math.max(1, Math.min(100, Math.round(raw)));
      if (status === STATUS.PENDING_CORRECTIVE || status === STATUS.REVISED_CHECKLIST_SUBMITTED) return 100;
      if (status === STATUS.REOPENED) return 78;
      if (status === STATUS.DRAFT) return 22;
      const section = String(record.current_section || record.currentSection || '').toLowerCase();
      const idx = SECTION_ORDER.indexOf(section);
      if (idx >= 0) return Math.max(18, Math.min(94, Math.round(((idx + 1) / SECTION_ORDER.length) * 100)));
      return 68;
    }

    function stageDetails(record, status, progress) {
      if (status === STATUS.PENDING_CORRECTIVE || status === STATUS.REVISED_CHECKLIST_SUBMITTED) {
        return { main: 'Corrective Action', sub: 'Review & Submit' };
      }
      if (status === STATUS.REOPENED) {
        return { main: 'Review & Submit', sub: 'Under Revision' };
      }
      const section = String(record.current_section || record.currentSection || '').toLowerCase();
      const idx = SECTION_ORDER.indexOf(section);
      const step = idx >= 0 ? ('Section ' + (idx + 1) + ' of ' + SECTION_ORDER.length) : ('Section ' + Math.max(1, Math.round((progress / 100) * SECTION_ORDER.length)) + ' of ' + SECTION_ORDER.length);
      return { main: 'Assessment Checklist', sub: step };
    }

    function progressSummary(progress) {
      const total = SECTION_ORDER.length;
      const safeProgress = Number(progress || 0);
      if (!(safeProgress > 0)) return '0 of ' + total + ' sections';
      const completed = Math.max(1, Math.min(total, Math.round((safeProgress / 100) * total)));
      return completed + ' of ' + total + ' sections';
    }

    function actionsForRecord(record, allActions) {
      return (allActions || []).filter(function (action) {
        return window.RiskModuleUtils && typeof RiskModuleUtils.isActionForRecord === 'function'
          ? RiskModuleUtils.isActionForRecord(action, record)
          : String(action.inspectionRef || '') === String(record.inspectionRef || '');
      });
    }

    function buildRows() {
      const records = RiskModuleUtils.getRecords();
      const actions = RiskModuleUtils.getActions();
      const grouped = {};

      records.forEach(function (record) {
        const ref = String(masterRef(record) || '').trim().toUpperCase();
        if (!ref) return;
        if (!grouped[ref]) grouped[ref] = [];
        grouped[ref].push(record);
      });

      const rows = Object.keys(grouped).map(function (refKey) {
        const versionsAll = grouped[refKey].slice().sort(function (a, b) {
          const v = recordVersion(b) - recordVersion(a);
          if (v !== 0) return v;
          return toMs(b.lastUpdatedAt || b.last_updated_at || b.updatedAt || b.createdAt) - toMs(a.lastUpdatedAt || a.last_updated_at || a.updatedAt || a.createdAt);
        });
        const latestOverall = versionsAll[0];
        const latestStatus = String(latestOverall.status || latestOverall.assessment_status || '');

        // Master-reference rule: only latest version decides queue membership.
        if (latestStatus === STATUS.PUBLISHED) return null;

        const ref = masterRef(latestOverall);
        const versions = versionsAll;
        const latest = latestOverall;
        const status = String(latest.status || latest.assessment_status || '');
        const progress = progressValue(latest, status);
        const snap = RiskModuleUtils.getRiskSnapshotForRecord(latest, actions);
        const riskLevel = normalizeRiskLevel(snap.residualLevel || latest.residualRiskLevel || latest.overallRiskLevel || 'Low');
        const riskScore = Number(snap.residualScore || latest.residualRiskScore || latest.overallRiskScore || 0);
        const stage = stageDetails(latest, status, progress);
        const countCorrective = isCorrectiveActionStage(status);

        const map = new Map();
        if (countCorrective) {
          actionsForRecord(latest, actions).forEach(function (action) {
            const key = String(action.actionId || (action.inspectionRef || '') + '::' + (action.sourceCode || ''));
            if (!map.has(key)) map.set(key, action);
          });
        }
        let overdueCA = 0;
        let openCA = 0;
        map.forEach(function (action) {
          const s = String(action.status || '').toLowerCase();
          const closed = s === 'closed' || s === 'verified closed';
          if (closed) return;
          if (s === 'overdue') overdueCA += 1;
          if (s === 'open' || s === 'in progress' || s === 'overdue' || s === 'closed pending verification') openCA += 1;
        });

        return {
          masterRef: ref,
          latestVersion: recordVersion(latest),
          versionCount: versions.length,
          status: status,
          statusLabel: statusLabel(status),
          recordType: String(latest.assessmentType || latest.assessment_type || latest.checklistType || latest.templateName || 'Assessment Checklist'),
          facility: familyValue(versions, ['facilityName', 'facility_name'], '-'),
          facilityType: familyValue(versions, ['facilityType', 'facility_type'], 'Fuel Station'),
          zone: zoneShort(familyValue(versions, ['location', 'zone'], '-')),
          riskLevel: riskLevel,
          riskScore: riskScore,
          stageMain: stage.main,
          stageSub: stage.sub,
          progress: progress,
          overdueCA: overdueCA,
          openCA: openCA,
          lastUpdated: latest.lastUpdatedAt || latest.last_updated_at || latest.updatedAt || latest.checklistSubmittedAt || latest.createdAt || '',
          inspectionDate: latest.assessment_date || latest.inspectionDate || latest.createdAt || '',
          latestRecord: latest
        };
      });

      const cleanRows = rows.filter(Boolean);
      cleanRows.sort(function (a, b) {
        const urgentA = a.overdueCA > 0 ? 1 : 0;
        const urgentB = b.overdueCA > 0 ? 1 : 0;
        if (urgentA !== urgentB) return urgentB - urgentA;
        const s = statusPriority(b.status) - statusPriority(a.status);
        if (s !== 0) return s;
        return toMs(b.lastUpdated) - toMs(a.lastUpdated);
      });

      return cleanRows;
    }

    function refreshTabsAndKpis(rows) {
      const all = rows.length;
      const draft = rows.filter(function (row) { return row.status === STATUS.DRAFT || row.status === STATUS.IN_PROGRESS; }).length;
      const pending = rows.filter(function (row) { return row.status === STATUS.PENDING_CORRECTIVE || row.status === STATUS.REVISED_CHECKLIST_SUBMITTED; }).length;
      const reopened = rows.filter(function (row) { return row.status === STATUS.REOPENED; }).length;

      document.getElementById('tabAll').textContent = String(all);
      document.getElementById('tabDraft').textContent = String(draft);
      document.getElementById('tabPending').textContent = String(pending);
      document.getElementById('tabReopened').textContent = String(reopened);

      document.getElementById('kpiTotal').textContent = String(all);
      document.getElementById('kpiDraft').textContent = String(draft);
      document.getElementById('kpiPending').textContent = String(pending);
    }

    function populateFilters(rows) {
      const zones = Array.from(new Set((rows || []).map(function (row) {
        return String(row.zone || '').trim();
      }).filter(function (value) {
        return !!value && value !== '-' && value.toLowerCase() !== 'n/a';
      }))).sort();

      const types = Array.from(new Set((rows || []).map(function (row) {
        return String(row.facilityType || '').trim();
      }).filter(function (value) {
        return !!value && value !== '-' && value.toLowerCase() !== 'n/a';
      }))).sort();

      const zoneNode = document.getElementById('fltZone');
      const typeNode = document.getElementById('fltType');
      const currentZone = zoneNode.value;
      const currentType = typeNode.value;

      zoneNode.innerHTML = ['<option value="">All Zones</option>'].concat(zones.map(function (zone) {
        return '<option value="' + RiskModuleUtils.esc(zone) + '">' + RiskModuleUtils.esc(zone) + '</option>';
      })).join('');
      typeNode.innerHTML = ['<option value="">All Types</option>'].concat(types.map(function (type) {
        return '<option value="' + RiskModuleUtils.esc(type) + '">' + RiskModuleUtils.esc(type) + '</option>';
      })).join('');

      if (zones.indexOf(currentZone) >= 0) zoneNode.value = currentZone;
      if (types.indexOf(currentType) >= 0) typeNode.value = currentType;
    }

    function applyFilters() {
      const search = String(document.getElementById('fltSearch').value || '').trim().toLowerCase();
      const zone = String(document.getElementById('fltZone').value || '').trim().toLowerCase();
      const type = String(document.getElementById('fltType').value || '').trim().toLowerCase();

      const tabRows = rowsForTab(state.allRows, state.activeTab);

      let rows = tabRows.filter(function (row) {
        const hay = [row.masterRef, row.facility, row.zone, row.facilityType, row.recordType, row.statusLabel].join(' ').toLowerCase();
        if (search && hay.indexOf(search) < 0) return false;
        if (zone && row.zone.toLowerCase() !== zone) return false;
        if (type && row.facilityType.toLowerCase() !== type) return false;
        return true;
      });

      state.rows = rows;
    }

    function fmtScore(score) {
      const n = Number(score || 0);
      return Number.isInteger(n) ? String(n) : n.toFixed(1);
    }

    function updatedParts(value) {
      const dateObj = new Date(value || 0);
      if (Number.isNaN(dateObj.getTime())) {
        return { date: '-', time: '-', relative: '-' };
      }
      const date = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      const time = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      const now = new Date();
      const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const startRow = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()).getTime();
      const diffDays = Math.floor((startToday - startRow) / 86400000);
      let rel = 'Today';
      if (diffDays === 1) rel = '1 day ago';
      else if (diffDays > 1) rel = diffDays + ' days ago';
      else if (diffDays < 0) rel = 'Today';
      return { date: date, time: time, relative: rel };
    }

    function ensurePageInRange() {
      const totalPages = Math.max(1, Math.ceil(state.rows.length / state.pageSize));
      if (state.page > totalPages) state.page = totalPages;
      if (state.page < 1) state.page = 1;
    }

    function pagedRows() {
      const start = (state.page - 1) * state.pageSize;
      return state.rows.slice(start, start + state.pageSize);
    }

    function measurePageSize() {
      const wrap = document.querySelector('.uc-table-wrap');
      const headRow = wrap ? wrap.querySelector('thead tr') : null;
      const firstRow = wrap ? wrap.querySelector('tbody tr') : null;
      if (!wrap || !headRow || !firstRow || firstRow.querySelector('.uc-empty')) return state.pageSize;
      const available = wrap.clientHeight - Math.ceil(headRow.getBoundingClientRect().height) - 2;
      const rowHeight = Math.max(1, Math.ceil(firstRow.getBoundingClientRect().height));
      const fitted = Math.floor(available / rowHeight);
      return Math.max(8, fitted);
    }

    function fitRowsToViewport() {
      const nextPageSize = measurePageSize();
      if (!Number.isFinite(nextPageSize) || nextPageSize === state.pageSize) return false;
      state.pageSize = nextPageSize;
      ensurePageInRange();
      return true;
    }

    function updateResultsMeta(visibleCount) {
      const meta = document.getElementById('resultsMeta');
      const total = state.rows.length;
      if (!total || !visibleCount) {
        meta.textContent = 'Showing 0 to 0 of ' + total + ' results';
        return;
      }
      const start = ((state.page - 1) * state.pageSize) + 1;
      const end = start + visibleCount - 1;
      meta.textContent = 'Showing ' + start + ' to ' + end + ' of ' + total + ' results';
    }

    function renderPagination() {
      const holder = document.getElementById('pagination');
      const totalPages = Math.max(1, Math.ceil(state.rows.length / state.pageSize));
      const buttons = [];

      buttons.push('<button class="uc-page-btn" data-page="' + Math.max(1, state.page - 1) + '" ' + (state.page === 1 ? 'disabled' : '') + '>‹</button>');
      for (let page = 1; page <= totalPages; page += 1) {
        buttons.push('<button class="uc-page-btn ' + (page === state.page ? 'active' : '') + '" data-page="' + page + '">' + page + '</button>');
      }
      buttons.push('<button class="uc-page-btn" data-page="' + Math.min(totalPages, state.page + 1) + '" ' + (state.page === totalPages ? 'disabled' : '') + '>›</button>');

      holder.innerHTML = buttons.join('');
    }

    function openContinueTarget(ref, version, status) {
      if (status === STATUS.PENDING_CORRECTIVE || status === STATUS.REVISED_CHECKLIST_SUBMITTED) {
        window.location.href = 'GOIL_Corrective_Action.html?v=20260318-masterrefdeep11&ref=' + encodeURIComponent(ref) + '&version=' + encodeURIComponent(version);
        return;
      }
      RiskModuleUtils.openAssessmentRecord(ref, version);
    }

    function renderRows() {
      const tbody = document.getElementById('tbody');
      const visibleRows = pagedRows();
      if (!visibleRows.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="uc-empty">No records found for this stage/filter selection.</div></td></tr>';
        updateResultsMeta(0);
        return;
      }

      const currentUser = RiskModuleUtils.getCurrentUser ? RiskModuleUtils.getCurrentUser() : {};

      tbody.innerHTML = visibleRows.map(function (row) {
        const urgent = row.overdueCA > 0;
        const parts = updatedParts(row.lastUpdated);
        const stageTone = statusToneClass(row.status);
        const facilitySub = row.facilityType && row.facilityType.toLowerCase() !== row.facility.toLowerCase()
          ? '<span class="sub">' + RiskModuleUtils.esc(row.facilityType) + '</span>'
          : '';

        const canEdit = RiskModuleUtils.canUserEditRecord
          ? RiskModuleUtils.canUserEditRecord(row.latestRecord, currentUser)
          : true;

        const actionBtn = canEdit
          ? '<button class="uc-btn" data-action="continue" data-ref="' + RiskModuleUtils.esc(row.masterRef) + '" data-version="' + RiskModuleUtils.esc(String(row.latestVersion)) + '" data-status="' + RiskModuleUtils.esc(row.status) + '">Resume Assessment <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>'
          : '<button class="uc-btn uc-btn-view-only" disabled title="You can view this assessment but only the assessor or an admin can edit it.">View Only <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';

        return ''
          + '<tr class="' + (urgent ? 'uc-row-urgent' : '') + '">'
          + '<td><div class="uc-ref-cell"><div class="uc-ref-lines"><span class="main">' + RiskModuleUtils.esc(row.masterRef) + '</span></div></div></td>'
          + '<td><div class="uc-fac"><span class="main">' + RiskModuleUtils.esc(row.facility) + '</span>' + facilitySub + '</div></td>'
          + '<td><span class="uc-zone">' + RiskModuleUtils.esc(row.zone) + '</span></td>'
          + '<td><span class="uc-stage-pill ' + stageTone + '">' + RiskModuleUtils.esc(row.statusLabel) + '</span></td>'
          + '<td><div class="uc-progress"><span class="pct">' + RiskModuleUtils.esc(String(row.progress)) + '%</span><div class="uc-progress-line"><span class="uc-progress-fill ' + stageTone + '" style="width:' + RiskModuleUtils.esc(String(row.progress)) + '%;"></span></div><span class="sub">' + RiskModuleUtils.esc(progressSummary(row.progress)) + '</span></div></td>'
          + '<td><div class="uc-updated"><span class="date">' + RiskModuleUtils.esc(parts.date) + '</span><span class="time">' + RiskModuleUtils.esc(parts.time) + '</span><span class="rel">' + RiskModuleUtils.esc(parts.relative) + '</span></div></td>'
          + '<td class="uc-col-action-cell"><div class="uc-actions">' + actionBtn + '</div></td>'
          + '</tr>';
      }).join('');

      updateResultsMeta(visibleRows.length);
    }

    function render() {
      populateFilters(rowsInFilterScope());
      refreshTabsAndKpis(state.allRows);
      applyFilters();
      ensurePageInRange();
      renderRows();
      if (state.rows.length && fitRowsToViewport()) {
        renderRows();
      }
      renderPagination();
    }

    function setActiveTab(tab) {
      state.activeTab = tab;
      state.page = 1;
      document.querySelectorAll('#tabs .uc-tab').forEach(function (button) {
        button.classList.toggle('active', button.getAttribute('data-tab') === state.activeTab);
      });
      render();
    }

    function bindEvents() {
      const backBtn = document.getElementById('backLandingBtn');
      if (backBtn) backBtn.addEventListener('click', RiskModuleUtils.goLanding);

      document.querySelectorAll('#tabs .uc-tab').forEach(function (button) {
        button.addEventListener('click', function () {
          setActiveTab(button.getAttribute('data-tab') || 'all');
        });
      });

      ['fltSearch', 'fltZone', 'fltType'].forEach(function (id) {
        const node = document.getElementById(id);
        node.addEventListener('input', function () {
          state.page = 1;
          render();
        });
        node.addEventListener('change', function () {
          state.page = 1;
          render();
        });
      });

      document.getElementById('tbody').addEventListener('click', function (event) {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const ref = button.getAttribute('data-ref');
        const version = button.getAttribute('data-version');
        const status = button.getAttribute('data-status') || '';
        openContinueTarget(ref, version, status);
      });

      document.getElementById('pagination').addEventListener('click', function (event) {
        const button = event.target.closest('button[data-page]');
        if (!button || button.disabled) return;
        const page = Number(button.getAttribute('data-page') || 1);
        state.page = Number.isFinite(page) && page > 0 ? page : 1;
        ensurePageInRange();
        renderRows();
        renderPagination();
      });

      document.getElementById('exportBtn').addEventListener('click', function () {
        const headers = ['Reference Number', 'Facility', 'Type', 'Zone', 'Status', 'Risk', 'Current Stage', 'Progress', 'Last Updated', 'Open CAs', 'Overdue CAs'];
        const lines = [headers.map(function (v) { return '"' + v + '"'; }).join(',')];
        state.rows.forEach(function (row) {
          const stage = row.stageMain + ' - ' + row.stageSub;
          lines.push([
            row.masterRef,
            row.facility,
            row.facilityType,
            row.zone,
            row.statusLabel,
            row.riskScore > 0 ? (row.riskLevel + ' (' + fmtScore(row.riskScore) + ')') : '-',
            stage,
            row.progress + '%',
            RiskModuleUtils.fmtDateTime(row.lastUpdated),
            row.openCA,
            row.overdueCA
          ].map(function (val) { return '"' + String(val == null ? '' : val).replace(/"/g, '""') + '"'; }).join(','));
        });
        const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'uncompleted-assessments.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      let resizeFrame = 0;
      window.addEventListener('resize', function () {
        if (resizeFrame) cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(function () {
          resizeFrame = 0;
          render();
        });
      });
    }

    function initFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const tab = params.get('tab');
      if (tab === 'all' || tab === 'draft' || tab === 'pending' || tab === 'reopened') state.activeTab = tab;
    }

    function init() {
      initFromQuery();
      state.allRows = buildRows();
      refreshTabsAndKpis(state.allRows);
      populateFilters(rowsInFilterScope());
      bindEvents();
      setActiveTab(state.activeTab);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
